name: Validate bot configuration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: python -m py_compile main.py bot_helpers.py main_with_no_framework.py openrouter_research.py
      - name: Install YAML parser
        run: python -m pip install PyYAML==6.0.2
      - name: Check workflow YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in Path(".github/workflows").glob("*.yaml"):
              with path.open(encoding="utf-8") as stream:
                  yaml.load(stream, Loader=yaml.BaseLoader)
              print(f"Parsed {path}")
          PY
