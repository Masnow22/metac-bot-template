name: Test Bot

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Submit forecasts to Metaculus (uses LLM credits even when false)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: futureeval-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Check required credentials
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        run: |
          test -n "$METACULUS_TOKEN" || { echo "Missing METACULUS_TOKEN"; exit 1; }
          test -n "$OPENROUTER_API_KEY$OPENAI_API_KEY$ANTHROPIC_API_KEY" || { echo "Missing LLM key; apply for free credits before running"; exit 1; }
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Run bot
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          PUBLISH_FORECASTS: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || github.event_name == 'schedule' && vars.FUTUREEVAL_PUBLISH_ENABLED == 'true' }}
        run: poetry run python main.py --mode test_questions
